name: Build and Push Docker Image

# This workflow runs on any push to the 'main' branch
on:
  push:
    branches: [ "main" , "test"]

jobs:
  build:
    runs-on: ubuntu-latest # The job will run on a virtual machine provided by GitHub

    steps:
    # Step 1: Check out your code from the repository
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Log in to Docker Hub using the secrets we created
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}



    # Step 3: Build the Docker image and push it to your Docker Hub account
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKE_USERNAME }}/local-mlops-demo:latest